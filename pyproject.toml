[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technitium-mcp"
version = "2026.9.28.1"
description = "MCP tool that lets Claude read and change a Technitium DNS Server through its API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "drmogie" }]
dependencies = ["mcp>=1.2"]

[project.scripts]
technitium-mcp = "technitium_mcp:main"

[tool.setuptools]
packages = ["technitium_mcp"]

[tool.setuptools.package-data]
technitium_mcp = ["endpoints.json"]
